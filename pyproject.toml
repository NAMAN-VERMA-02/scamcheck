[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scamcheck"
version = "0.2.0"
description = "ScamCheck Research Workbench: evidence-first English/Hinglish scam analysis, benchmark lab and seeded robustness testing"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
# HTTP API for the web app.
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
# Baseline B2 (character n-gram TF-IDF + logistic regression).
eval = ["scikit-learn>=1.5,<2"]
dev = [
    "scamcheck[api,eval]",
    "pytest>=8",
    "hypothesis>=6.100,<7",  # property-based and seeded randomized tests
    "httpx2>=2.16,<3",       # HTTP client used by Starlette's TestClient (replaces httpx)
    "ruff==0.17.2",          # pinned exactly: new releases add lint rules
]

[project.scripts]
scamcheck = "scamcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
# Explicit, so a ruff upgrade cannot silently change the gate: pyflakes, pycodestyle errors, bugbear.
select = ["E4", "E7", "E9", "F", "B"]
# Style-only bugbear rules and short names in existing code; not defects.
ignore = ["B904", "B905", "E741"]
